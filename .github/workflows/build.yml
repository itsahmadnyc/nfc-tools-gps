name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w nfc-pcsc,@pokusew/pcsclite

      - name: Make Windows distributable
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/make/**/*
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w nfc-pcsc,@pokusew/pcsclite

      - name: Make macOS distributable
        run: npx electron-forge make --platform=darwin --arch=arm64

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: out/make/**/*
          retention-days: 7
